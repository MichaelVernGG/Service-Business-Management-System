<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            padding: 30px;
        }
        .container {
            display: flex;
            gap: 20px;
        }
        .card {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .title {
            font-size: 14px;
            color: gray;
        }
        .value {
            font-size: 28px;
            font-weight: bold;
        }
        button {
		    padding: 10px 20px;
		    background-color: #4CAF50;
		    color: white;
		    border: none;
		    border-radius: 5px;
		    cursor: pointer;
		}
		button:hover {
	  	 	background-color: #45a049;
		}
		.value-container {
		    display: flex;
		    align-items: center;
		    gap: 10px;
		}
		.eye-btn {
		    border: none;
		    background: none;
		    cursor: pointer;
		    font-size: 18px;
		}
		.eye-btn:hover {
		    opacity: 0.7;
		}
    </style>
</head>
<body>
 <script>
       let hidden = false;

       function toggleSales() {
           const sales = document.getElementById("totalSales");

           if (hidden) {
               sales.textContent = sales.dataset.value;
           } else {
               sales.textContent = "*******";
           }

           hidden = !hidden;
       }
   </script>

<div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 10px; flex-direction: column">
	<div>
	    <h1 style="margin: 0;">Service Business Management System</h1>
	</div>
	
	<div>
		 <h2 style="margin: 0;">Admin Dashboard</h2>
	</div>
	<div>
		 <br>
		 <br>
		 <br>
	</div>
    
	
	<div style="display: flex; gap: 10px;">
        <a th:href="@{/customers}">
            <button>Customer Management</button>
        </a>
        <a th:href="@{/jobs}">
            <button>Job Orders</button>
        </a>
       <a th:href="@{/about}">
            <button>About</button>
        </a>
         <form th:action="@{/logout}" method="post" style="display:inline;">
 	  		 <button type="submit">Logout</button>
		</form>
    </div>
    
</div>


<div class="container">
    <div class="card">
        <div class="title">Total Customers</div>
        <div class="value" th:text="${totalCustomers}">0</div>
    </div>

    <div class="card">
        <div class="title">Total Job Orders</div>
        <div class="value" th:text="${totalJobOrders}">0</div>
    </div>

    <div class="card">
        <div class="title">Today's Sales</div>
        <div class="value" th:text="${todaySales}">0</div>
    </div>

    <div class="card">
        <div class="title">Monthly Sales</div>
        <div class="value" th:text="${monthlySales}">0</div>
    </div>
    <div class="card">
        <div class="title">Total Sales</div>
        <div class="value-container"><span id="totalSales"
              class="value"
              th:data-value="${totalSales}"
              th:text="${totalSales}">
            0
        </span>
         <button type="button" class="eye-btn" onclick="toggleSales()">
            👁‍🗨
        </button>
        </div>
    </div>
</div>

</body>
</html>
