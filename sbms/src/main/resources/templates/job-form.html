<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Job Order Form</title>
</head>
<body>

<h2>Job Order Form</h2>

<div>
    <a th:href="@{/jobs}"><button>Back to Job Orders</button></a>
    <a th:href="@{/dashboard}"><button>Back to Dashboard</button></a>
</div>
<br>

<form th:action="@{/jobs/save}" th:object="${jobOrder}" method="post">

    <input type="hidden" th:field="*{id}" />

	<label>Customer:</label><br>
	<select th:field="*{customer.id}" required>
	    <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.name}"></option>
	</select><br><br>


    <label>Service Type:</label><br>
    <input type="text" th:field="*{serviceType}" required/><br><br>

    <label>Description:</label><br>
    <textarea th:field="*{description}"></textarea><br><br>

    <label>Status:</label><br>
    <select th:field="*{status}" required>
        <option th:value="PENDING">Pending</option>
        <option th:value="IN_PROGRESS">In Progress</option>
        <option th:value="DONE">Done</option>
    </select><br><br>

    <label>Amount:</label><br>
    <input type="number" step="0.01" th:field="*{amount}" required/><br><br>

    <label>Payment Status:</label><br>
    <select th:field="*{paymentStatus}" required>
        <option th:value="PAID">Paid</option>
        <option th:value="UNPAID">Unpaid</option>
    </select><br><br>

    <label>Date:</label><br>
    <input type="date" th:field="*{date}" /><br><br>

    <button type="submit">Save</button>
</form>

</body>
</html>
